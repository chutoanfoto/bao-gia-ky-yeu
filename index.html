    <title>Bảng Giá Kỷ Yếu - Chu Toàn (3D Liquid Glass PRO)</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Mulish:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* MÀU GỐC CỦA KỶ YẾU ĐƯỢC GIỮ NGUYÊN */
            --accent: #ffffff; 
            --gold: #d4af37; 
            --text-main: #f0f0f0;
            --border-light: rgba(255, 255, 255, 0.15);
            
            /* THÔNG SỐ 3D LIQUID GLASS PRO ĐỘC QUYỀN */
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.01) 100%);
            --glass-border: 1px solid rgba(255, 255, 255, 0.05);
            --glass-top: 1px solid rgba(255, 255, 255, 0.45);
            --glass-left: 1px solid rgba(255, 255, 255, 0.25);
            --glass-bottom: 1px solid rgba(0, 0, 0, 0.5);
            --glass-right: 1px solid rgba(0, 0, 0, 0.3);
            --glass-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 
                            inset 0 1px 2px rgba(255, 255, 255, 0.25), 
                            inset 0 -1px 2px rgba(0, 0, 0, 0.2);
        }

        html, body {
            -webkit-text-size-adjust: 100%;
            -moz-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            text-size-adjust: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Mulish', sans-serif;
            background: #040805; 
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            position: relative;
        }

        /* LỚP NỀN XANH RÊU GỐC */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #183021 0%, #0d1a12 30%, #070e0a 70%, #040805 100%);
            z-index: 0;
        }
        
        .bg-overlay::before {
            content: '';
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 500px;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.04) 0%, transparent 60%);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1; 
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 30px;
            overflow: hidden;
        }

        /* HEADER & LOGO MỚI DỜI LÊN TRÊN */
        .hero {
            text-align: center;
            padding: 45px 15px 25px; 
            margin-bottom: 10px; 
            border-bottom: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .hero-logo {
            width: 150px; 
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0px 3px 8px rgba(0,0,0,0.7)) brightness(0) invert(1);
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 26px; 
            font-weight: 600;
            color: var(--accent);
            margin: 0;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            line-height: 1.4; 
            text-shadow: 2px 2px 8px rgba(0,0,0,0.6); 
        }

        .pricing-section {
            padding: 0 15px 15px; 
        }

        /* TIÊU ĐỀ NHÓM */
        .group-header {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            margin: 35px 0 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .group-header::before, .group-header::after {
            content: "";
            height: 1px;
            width: 40px;
            background: var(--border-light);
        }

        /* 3D LIQUID GLASS PRO CHUẨN */
        .liquid-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(120%);
            -webkit-backdrop-filter: blur(20px) saturate(120%);
            
            border: var(--glass-border);
            border-top: var(--glass-top);
            border-left: var(--glass-left);
            border-bottom: var(--glass-bottom);
            border-right: var(--glass-right);
            
            box-shadow: var(--glass-shadow);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .liquid-glass::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: inherit;
            background: linear-gradient(110deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.02) 30%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* CARD BÁO GIÁ */
        .price-card {
            padding: 20px 22px; 
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price-card > div {
            position: relative;
            z-index: 1;
        }

        .card-title {
            font-size: 15px; 
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-main);
            flex: 1;
        }

        .card-price {
            font-family: 'Mulish', sans-serif;
            font-size: 17px; 
            color: var(--accent);
            font-weight: 800;
            letter-spacing: 0.5px;
            text-align: right;
            white-space: nowrap;
            flex-shrink: 0; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .price-unit {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            margin-left: 2px;
            text-shadow: none;
        }

        /* CHI TIẾT DỊCH VỤ */
        .details-section {
            padding: 15px 20px 35px;
        }

            padding: 20px
