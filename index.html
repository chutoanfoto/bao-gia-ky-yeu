<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#060606" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lịch Chụp">
    
    <link rel="apple-touch-icon" href="https://i.postimg.cc/prXXD19w/logo-app-lich-chup.jpg">
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.postimg.cc/prXXD19w/logo-app-lich-chup.jpg">
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/prXXD19w/logo-app-lich-chup.jpg">
    <link rel="shortcut icon" href="https://i.postimg.cc/prXXD19w/logo-app-lich-chup.jpg">

    <title>ChuToan Foto - Quản Lý Lịch Chụp</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        /* ======== LIGHT MODE: TRUE LIQUID GLASS (Chuẩn iOS) ======== */
        :root {
            --bg-base: #f4f5f7; 
            --bg-mesh: 
                radial-gradient(circle at 15% 50%, rgba(223, 185, 110, 0.12), transparent 45%),
                radial-gradient(circle at 85% 30%, rgba(135, 160, 190, 0.15), transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(255, 255, 255, 0.8), transparent 80%);
            
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-shine: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.1) 40%, rgba(255,255,255,0) 100%);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-border-top: rgba(255, 255, 255, 1);
            --glass-border-left: rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 12px 36px rgba(0,0,0,0.06), inset 0 -1px 2px rgba(255,255,255,0.3);
            
            --badge-bg: rgba(255, 255, 255, 0.7);
            --badge-border: 1px solid rgba(255, 255, 255, 1);
            --badge-shadow: 0 4px 12px rgba(197, 155, 39, 0.1);

            --text-main: #141414; --text-muted: #78746c; --text-sub: #9e9a8f;
            --accent-gold: #b38814; 
            --tag-gold-bg: rgba(197, 155, 39, 0.12); --tag-gold-text: #96710d;
            --alert-red: #d35400; --alert-bg: rgba(211, 84, 0, 0.1);
            --success-green: #27ae60; --success-bg: rgba(39, 174, 96, 0.12);
            
            --modal-bg: rgba(245, 243, 238, 0.95); 
            --input-bg: rgba(255, 255, 255, 0.9); 
            --input-border: rgba(0, 0, 0, 0.08);
            --input-text: #141414; --input-placeholder: #a8a398;
            
            --btn-secondary-bg: rgba(255, 255, 255, 0.8); --btn-secondary-text: #141414;
            --divider-line: rgba(0, 0, 0, 0.06);
            --header-bg: rgba(244, 245, 247, 0.75); 
            --logo-filter: invert(1); --radius-card: 22px;
        }

        /* ======== DARK MODE: HOÀN HẢO GIỮ NGUYÊN 100% ======== */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-base: #060606; 
                --bg-mesh: 
                    radial-gradient(ellipse at 50% 0%, rgba(90, 75, 45, 0.25) 0%, transparent 55%), 
                    radial-gradient(ellipse at 50% 100%, rgba(45, 55, 45, 0.2) 0%, transparent 55%);
                
                --glass-bg: rgba(30, 30, 28, 0.4);
                --glass-shine: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 40%);
                --glass-border: rgba(255, 255, 255, 0.03);
                --glass-border-top: rgba(255, 255, 255, 0.15); 
                --glass-border-left: rgba(255, 255, 255, 0.08);
                --glass-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
                
                --badge-bg: rgba(30, 28, 25, 0.6);
                --badge-border: 1px solid rgba(223, 185, 110, 0.2);
                --badge-shadow: 0 8px 20px rgba(0,0,0,0.6);

                --text-main: #f0f0f0; --text-muted: #9a9a9a; --text-sub: rgba(240, 240, 240, 0.5);
                --accent-gold: #dfb96e; 
                --tag-gold-bg: rgba(223, 185, 110, 0.12); --tag-gold-text: #dfb96e;
                --alert-red: #ff4747; --alert-bg: rgba(255, 71, 71, 0.12);
                --success-green: #30d158; --success-bg: rgba(48, 209, 88, 0.12);
                
                --modal-bg: rgba(15, 15, 14, 0.96); 
                --input-bg: rgba(25, 25, 23, 0.6); 
                --input-border: rgba(255, 255, 255, 0.06);
                --input-text: #f0f0f0; --input-placeholder: #777777;
                
                --btn-secondary-bg: rgba(255, 255, 255, 0.08); --btn-secondary-text: #dfb96e;
                --divider-line: rgba(255, 255, 255, 0.06);
                --header-bg: rgba(6, 6, 6, 0.7); 
                --logo-filter: none;
            }
        }

        html, body { 
            margin: 0; padding: 0; width: 100vw; max-width: 100%; overflow-x: hidden; overscroll-behavior-x: none; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-base);
            background-image: var(--bg-mesh);
            background-attachment: fixed;
            background-size: cover;
            color: var(--text-main); min-height: 100vh; -webkit-tap-highlight-color: transparent; 
        }
        body.modal-open { overflow: hidden; position: fixed; width: 100%; height: 100%; }

        .toast-msg {
            position: fixed; top: 85px; left: 50%; transform: translateX(-50%) scale(0.9);
            background: var(--card-bg); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%);
            color: var(--text-main); padding: 12px 24px; border-radius: 30px;
            font-size: 13px; font-weight: 700; z-index: 1000;
            border: 1px solid var(--accent-gold); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center; white-space: nowrap;
        }
        .toast-msg.show { opacity: 1; transform: translateX(-50%) scale(1); }

        .glass-fx { 
            background: var(--glass-bg); 
            backdrop-filter: blur(35px) saturate(200%); 
            -webkit-backdrop-filter: blur(35px) saturate(200%); 
            border: 1px solid var(--glass-border); 
            border-top-color: var(--glass-border-top);
            border-left-color: var(--glass-border-left);
            box-shadow: var(--glass-shadow); 
            position: relative;
            overflow: hidden;
            transform: translateZ(0);
        }
        .glass-fx::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--glass-shine); pointer-events: none; z-index: 0; border-radius: inherit;
        }
        .glass-fx > * { position: relative; z-index: 1; }

        .header { position: sticky; top: 0; z-index: 50; width: 100%; padding: 14px 20px; background: var(--header-bg); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); border-bottom: 1px solid var(--divider-line); display: flex; justify-content: space-between; align-items: center; }
        .header img { height: 30px; object-fit: contain; filter: var(--logo-filter); position: relative; z-index: 2;}
        .status-badge { position: relative; z-index: 2; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; background: var(--success-bg); color: var(--success-green); font-size: 12px; font-weight: 700; border: 1px solid rgba(48, 209, 88, 0.2); }
        .status-dot { width: 6px; height: 6px; background: var(--success-green); border-radius: 50%; box-shadow: 0 0 8px var(--success-green); }

        .container { position: relative; z-index: 2; width: 100%; padding: 16px; max-width: 580px; margin: 0 auto; padding-bottom: 150px; }
        
        .section-title { font-size: 11px; font-weight: 800; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 14px; text-transform: uppercase; margin-left: 4px; }

        .calendar-swipe-header { text-align: center; margin-bottom: 20px; padding-top: 10px; cursor: pointer; user-select: none; }
        .calendar-title-text { font-size: 15px; font-weight: 800; color: var(--accent-gold); letter-spacing: 4px; text-transform: uppercase; text-shadow: 0 0 20px rgba(223, 185, 110, 0.3); }

        .year-block, .month-block, .day-block { transition: max-height 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease, margin 0.3s ease; max-height: 8000px; opacity: 1; overflow: hidden; transform-origin: top; }
        .hidden-step { max-height: 0 !important; opacity: 0 !important; margin-top: 0 !important; margin-bottom: 0 !important; pointer-events: none; border: none !important; }

        .year-header { padding: 20px 22px; margin: 16px 0 12px 0; border-radius: 24px; color: var(--accent-gold); font-weight: 800; font-size: 17px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; letter-spacing: 2px; }
        .year-content { display: none; } .year-content.show { display: block; animation: fadeIn 0.3s ease; }

        .month-header { padding: 16px 20px; margin: 12px 0 8px 8px; border-radius: 20px; border-left: 3px solid var(--accent-gold); color: var(--accent-gold); font-weight: 700; font-size: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none;}
        .month-content { display: none; } .month-content.show { display: block; animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }

        .day-header { padding: 14px 18px; margin: 8px 0 8px 16px; border-radius: 18px; border-left: 2px solid var(--text-muted); color: var(--text-main); font-weight: 700; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none;}
        @media (prefers-color-scheme: light) { .day-header { border-left-color: var(--accent-gold); } }
        .day-content { display: none; } .day-content.show { display: block; animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        .toggle-icon { transition: transform 0.25s ease; font-size: 11px; opacity: 0.8; }

        .session-divider { display: flex; align-items: center; margin: 26px 0 18px 24px; font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; -webkit-tap-highlight-color: transparent;}
        .session-content { display: block; overflow: hidden; animation: fadeIn 0.3s ease; }
        .session-content.collapsed { display: none; }
        .session-divider span { 
            display: inline-flex; align-items: center; 
            background: var(--badge-bg); 
            padding: 8px 20px; 
            border-radius: 30px; 
            color: var(--accent-gold); 
            border: var(--badge-border); 
            box-shadow: var(--badge-shadow); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); 
            position: relative; z-index: 2;
            transition: transform 0.15s ease;
        }
        .session-divider:active span { transform: scale(0.95); }
        .session-divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--accent-gold), transparent); margin-left: 14px; opacity: 0.4; }

        .card { border-radius: var(--radius-card); padding: 22px; margin: 0 0 16px 24px; cursor: pointer; transition: transform 0.15s ease; }
        .card:active { transform: scale(0.985); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
        
        .client-name-container { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
        .client-name { font-size: 18px; font-weight: 800; color: var(--text-main); margin: 0; letter-spacing: -0.2px; }
        
        .social-links-row { display: flex; align-items: center; gap: 8px; }
        .social-icon { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; transition: opacity 0.2s; opacity: 1;}
        .social-icon:active { opacity: 0.5; }

        .tag-package { display: inline-block; padding: 5px 12px; border-radius: 8px; font-size: 11.5px; font-weight: 700; background: var(--tag-gold-bg); color: var(--tag-gold-text); border: 1px solid rgba(223, 185, 110, 0.2); }
        .tag-session { font-size: 11.5px; font-weight: 600; background: var(--btn-secondary-bg); color: var(--text-main); padding: 6px 14px; border-radius: 8px; border: 1px solid var(--divider-line); }

        .location-row { display: flex; align-items: flex-start; margin-bottom: 10px; font-size: 14px; color: var(--text-main); }
        .location-label { display: flex; align-items: center; font-weight: 600; color: var(--text-muted); width: 100px; flex-shrink: 0; }
        .location-value { font-weight: 500; }

        .action-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; margin-bottom: 18px; }
        .action-link-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 11.5px; font-weight: 700; border: 1px solid var(--divider-line); background: var(--btn-secondary-bg); color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px;}
        @media (prefers-color-scheme: dark) { .action-link-btn { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.05); } }

        .money-bar { background: rgba(0,0,0,0.02); border-radius: 14px; border: 1px solid var(--divider-line); padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.01); }
        @media (prefers-color-scheme: dark) { .money-bar { background: rgba(255,255,255,0.03); box-shadow: inset 0 2px 10px rgba(0,0,0,0.2); border-color: rgba(255,255,255,0.05); } }
        .money-bar .total { font-weight: 600; color: var(--text-muted); } .money-bar .total-num { color: var(--text-main); font-weight: 800; }
        .money-bar .debt { color: var(--alert-red); font-weight: 800; } .money-bar .paid { color: var(--success-green); font-weight: 800; }

        .card-expanded-content { display: none; margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--divider-line); }
        .card-expanded-content.show { display: block; animation: fadeIn 0.2s ease; }
        .detail-item { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 10px; color: var(--text-muted); } .detail-item span:last-child { font-weight: 700; color: var(--text-main); }
        
        .detail-note { margin-top: 14px; padding: 16px; background: rgba(0,0,0,0.02); border-radius: 14px; border: 1px solid var(--divider-line); }
        @media (prefers-color-scheme: dark) { .detail-note { background: rgba(255,255,255,0.02); border-color: rgba(255,255,255,0.05); } }
        .detail-note-label { font-size: 11.5px; font-weight: 800; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 1px;}
        .detail-note-content { font-size: 14px; font-weight: 500; color: var(--text-main); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }

        .card-btns-row { display: flex; gap: 12px; margin-top: 18px; position: relative; z-index: 10;}
        
        .btn-card-action { 
            flex: 1; display:flex; justify-content:center; align-items:center; 
            padding: 14px 0; border: none; border-radius: 12px; font-size: 12.5px; 
            font-weight: 700; cursor: pointer; text-transform: uppercase; 
            letter-spacing: 0.5px; border: 1px solid var(--divider-line); 
            transition: all 0.15s ease; -webkit-tap-highlight-color: transparent;
        }
        .btn-card-action:active { transform: scale(0.92); opacity: 0.8; filter: brightness(0.9); }
        .btn-edit { background: var(--btn-secondary-bg); color: var(--accent-gold); } 
        .btn-delete { background: var(--alert-bg); color: var(--alert-red); border-color: transparent;}

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
        .stat-card { border-radius: 22px; padding: 20px; }
        .stat-label { font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;}
        .stat-value { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
        .stat-value.gold { color: var(--accent-gold); text-shadow: 0 0 15px rgba(223, 185, 110, 0.4); } .stat-value.green { color: var(--success-green); } .stat-value.red { color: var(--alert-red); }

        .select-filter { width: 100%; padding: 16px 18px; border-radius: 18px; color: var(--text-main); font-size: 15px; font-weight: 700; outline: none; border-color: var(--card-border); appearance: none; -webkit-appearance: none; background: url('data:image/svg+xml;utf8,<svg fill="%23dfb96e" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>') no-repeat right 14px center; }

        .fab { position: fixed; bottom: 32px; right: 24px; width: 60px; height: 60px; background: linear-gradient(135deg, var(--accent-gold), #a38228); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 30px; font-weight: 300; box-shadow: 0 12px 30px rgba(197, 155, 39, 0.4); cursor: pointer; z-index: 80; border: 1px solid rgba(255,255,255,0.4); }
        @media (prefers-color-scheme: dark) { .fab { color: #000; box-shadow: 0 12px 30px rgba(223, 185, 110, 0.3); border-color: rgba(255,255,255,0.2);} }
        .fab:active { transform: scale(0.92); }

        .modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); justify-content: center; align-items: flex-end; overscroll-behavior: contain; width: 100vw; }
        .modal-content { background: var(--modal-bg); border-top: 1px solid var(--card-border-top); border-radius: 32px 32px 0 0; width: 100%; max-width: 580px; max-height: 88vh; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 30px 24px 40px 24px; box-shadow: 0 -20px 60px rgba(0,0,0,0.6); animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; } 
        .modal-header h3 { margin: 0; font-size: 20px; color: var(--accent-gold); font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase;} 
        .close-btn { font-size: 16px; color: var(--text-main); cursor: pointer; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: var(--btn-secondary-bg); border-radius: 50%; border: 1px solid var(--divider-line); }
        
        .tab-panel { display: none; } .tab-panel.active { display: block; }
        .form-group { margin-bottom: 18px; display: flex; flex-direction: column; width: 100%; } 
        .form-group label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; margin-left: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;} 
        
        .form-control, .form-select { width: 100%; padding: 16px 16px; background: var(--input-bg) !important; border: 1px solid var(--input-border) !important; border-radius: 14px; color: var(--input-text) !important; font-size: 15px; font-weight: 500; outline: none; -webkit-appearance: none; transition: all 0.2s ease; box-shadow: inset 0 2px 5px rgba(0,0,0,0.02); } 
        .form-control::placeholder { color: var(--input-placeholder); font-weight: 400;}
        .form-control:focus, .form-select:focus { border-color: var(--accent-gold) !important; box-shadow: 0 0 0 3px rgba(223, 185, 110, 0.15), inset 0 2px 5px rgba(0,0,0,0.02); }
        textarea.form-control { resize: vertical; min-height: 90px; font-family: inherit; line-height: 1.5; } 

        .btn-submit { width: 100%; padding: 20px; border: none; border-radius: 16px; font-weight: 800; font-size: 15px; color: #fff; margin-top: 16px; cursor: pointer; background: linear-gradient(135deg, var(--accent-gold), #997328); box-shadow: 0 8px 25px rgba(197, 155, 39, 0.25); text-transform: uppercase; letter-spacing: 1px; transition: all 0.15s;} 
        @media (prefers-color-scheme: dark) { .btn-submit { color: #000; } }
        .btn-submit:active { transform: scale(0.98); opacity: 0.8;}
        
        .btn-pay { display:flex; justify-content:center; align-items:center; background: rgba(39, 174, 96, 0.12); color: var(--success-green); width: 100%; padding: 16px; border: 1px solid rgba(39, 174, 96, 0.3); border-radius: 14px; font-weight: 800; font-size: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.15s;} 
        .btn-pay:active { transform: scale(0.96); opacity: 0.8; }
        
        .loader { text-align: center; padding: 50px; color: var(--accent-gold); font-weight: 700; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }

        /* DANH SÁCH QUẢN LÝ LỊCH ẨN */
        .hidden-item-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 18px; margin-bottom: 12px; border-radius: 16px;
        }
        .btn-restore {
            background: rgba(39, 174, 96, 0.15); color: var(--success-green);
            border: 1px solid rgba(39, 174, 96, 0.2); padding: 8px 16px; 
            border-radius: 10px; font-weight: 800; font-size: 11.5px; 
            text-transform: uppercase; cursor: pointer; transition: transform 0.15s;
        }
        .btn-restore:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <div id="appToast" class="toast-msg"></div>

    <div class="app-bg"></div>
    <div class="app-overlay"></div>

    <!-- MODAL QUẢN LÝ LỊCH ẨN -->
    <div class="modal" id="modalRestore" onclick="if(event.target === this) closeRestoreModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalRestoreTitle">LỊCH ĐANG ẨN</h3>
                <span class="close-btn" onclick="closeRestoreModal()">✕</span>
            </div>
            <div id="hiddenItemsContainer"></div>
            <button class="btn-submit" style="margin-top:10px; background: rgba(0,0,0,0.05); color: var(--text-main); border: 1px solid var(--divider-line); box-shadow: none;" onclick="restoreAllHidden()">KHÔI PHỤC TẤT CẢ</button>
        </div>
    </div>

    <div class="container">
        <div class="header glass-fx" style="border-radius: 26px; margin-bottom: 26px;">
            <img src="https://i.postimg.cc/wvF7Hr48/chutoanfoto2026-logo-new.png" alt="ChuToan Foto Logo">

        </div>

        function showToast(message) {
            let toast = document.getElementById('appToast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        let pressTimer;
        function startLongPress(e, monthBlockId, labelText) {
            pressTimer = setTimeout(() => {
                let block = document.getElementById(monthBlockId);
                if (block) {
                    block.classList.add('hidden-step');
                    saveUIState();
                    showToast(`Đã ẩn ${labelText}. Chạm vào chữ LỊCH CHỤP để hiện lại.`);
                }
            }, 600);
        }
        function cancelLongPress() {
            clearTimeout(pressTimer);
        }

        function saveUIState() {
            let state = {
                shows: Array.from(document.querySelectorAll('.show')).map(el => el.id).filter(id => id),
                hiddens: Array.from(document.querySelectorAll('.hidden-step')).map(el => el.id).filter(id => id),
                collapsedSessions: Array.from(document.querySelectorAll('.session-content.collapsed')).map(el => el.id).filter(id => id)
            };
            localStorage.setItem('chutoanUIState', JSON.stringify(state));
        }

        function restoreUIState() {
            let saved = localStorage.getItem('chutoanUIState');
            if (!saved) return;
            let state = JSON.parse(saved);

            document.querySelectorAll('.show').forEach(el => {
                el.classList.remove('show');
                if(el.previousElementSibling && el.previousElementSibling.querySelector('.toggle-icon')) {
                    el.previousElementSibling.querySelector('.toggle-icon').style.transform = 'rotate(0deg)';
                }
            });

            if (state.shows) {
                state.shows.forEach(id => {
                    let el = document.getElementById(id);
                    if (el) {
                        el.classList.add('show');
                        if(el.previousElementSibling && el.previousElementSibling.querySelector('.toggle-icon')) {
                            el.previousElementSibling.querySelector('.toggle-icon').style.transform = 'rotate(180deg)';
                        }
                    }
                });
            }

            if (state.hiddens) {
                state.hiddens.forEach(id => {
                    let el = document.getElementById(id);
                    if (el) el.classList.add('hidden-step');
                });
            }

            if (state.collapsedSessions) {
                state.collapsedSessions.forEach(id => {
                    let el = document.getElementById(id);
                    if (el) {
                        el.classList.add('collapsed');
                        if(el.previousElementSibling && el.previousElementSibling.querySelector('.toggle-icon')) {
                            el.previousElementSibling.querySelector('.toggle-icon').style.transform = 'rotate(0deg)';
                        }
                    }
                });
            }
        }

        // TÍNH NĂNG MỚI: DANH SÁCH QUẢN LÝ LỊCH ẨN
        document.getElementById('swipeHandle').addEventListener('click', function() {
            let hiddenBlocks = document.querySelectorAll('.hidden-step');
            if (hiddenBlocks.length === 0) {
                showToast("Hiện không có lịch nào đang bị ẩn.");
                return;
            }
            
            let container = document.getElementById('hiddenItemsContainer');
            let html = '';
            
            hiddenBlocks.forEach(block => {
                let id = block.id;
                let title = '';
                let y = block.getAttribute('data-year');
                let m = block.getAttribute('data-month');
                let d = block.getAttribute('data-day');

                if (block.classList.contains('year-block')) {
                    title = `NĂM ${y}`;
                } else if (block.classList.contains('month-block')) {
                    title = `THÁNG ${m} / ${y}`;
                } else if (block.classList.contains('day-block')) {
                    title = `NGÀY ${("0"+d).slice(-2)}/${("0"+m).slice(-2)}/${y}`;
                }
                
                html += `<div class="hidden-item-row glass-fx" onclick="restoreSingle('${id}')">
                    <span style="font-size:14.5px; font-weight:800; color:var(--text-main);">${ICON_CALENDAR} ${title}</span>
                    <button type="button" class="btn-restore">Hiện</button>
                </div>`;
            });
            
            container.innerHTML = html;
            document.body.classList.add('modal-open'); 
            document.getElementById('modalRestore').style.display = 'flex';
        });

        function closeRestoreModal() {
            document.getElementById('modalRestore').style.display = 'none';
            if(document.getElementById('modalForm').style.display !== 'flex') {
                document.body.classList.remove('modal-open');
            }
        }
        
        function restoreSingle(id) {
            let el = document.getElementById(id);
            if (el) {
                el.classList.remove('hidden-step');
                saveUIState();
                
                // Cập nhật lại danh sách hiện tại
                let hiddenBlocks = document.querySelectorAll('.hidden-step');
                if (hiddenBlocks.length === 0) {
                    closeRestoreModal();
                    showToast("Đã khôi phục toàn bộ lịch ẩn.");
                } else {
                    document.getElementById('swipeHandle').click(); // Refresh danh sách
                    showToast("Đã hiển thị lại lịch.");
                }
            }
        }
        
        function restoreAllHidden() {
            let hidden = document.querySelectorAll('.hidden-step');
            hidden.forEach(el => el.classList.remove('hidden-step')); 
            saveUIState(); 
            closeRestoreModal();
            showToast("Đã khôi phục toàn bộ lịch ẩn.");
        }

        function parseNum(val) { if (val === undefined || val === null) return 0; let str = String(val).replace(/\D/g, ''); return parseInt(str, 10) || 0; }
        function formatMoney(num) { return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(parseNum(num)); }
        function formatInputMoney(num) { let n = parseNum(num); return n === 0 ? '' : new Intl.NumberFormat('vi-VN').format(n); }
        function findVal(row, keyword) { if (!row) return ''; let key = Object.keys(row).find(k => k.toLowerCase().includes(keyword.toLowerCase())); return key ? row[key] : ''; }

        function parseDateCustom(str) {
            if (!str) return null; str = str.toString().trim();
            if (/^\d{4}-\d{1,2}-\d{1,2}/.test(str)) { let parts = str.split('T')[0].split('-'); return new Date(parts[0], parts[1] - 1, parts[2]); }
            if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(str)) { let parts = str.split('/'); return new Date(parts[2], parts[1] - 1, parts[0]); }
            let d = new Date(str); return isNaN(d.getTime()) ? null : d;
        }

        function formatDateDisplay(d) {
            if (!d) return '--'; let day = ("0" + d.getDate()).slice(-2); let month = ("0" + (d.getMonth() + 1)).slice(-2); let year = d.getFullYear(); return `${day}/${month}/${year}`;
        }
        function dateToISO(dObj) {
            if (!dObj) return ''; let year = dObj.getFullYear(); let month = ("0" + (dObj.getMonth() + 1)).slice(-2); let day = ("0" + dObj.getDate()).slice(-2); return `${year}-${month}-${day}`;
        }

        async function loadData() {
            const cachedData = localStorage.getItem('chutoanFotoCache');
            if (cachedData && isFirstLoad) { try { renderUI(JSON.parse(cachedData)); } catch(e) {} }

            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                localStorage.setItem('chutoanFotoCache', JSON.stringify(data));
                renderUI(data); 
            } catch (e) { 
                if (!localStorage.getItem('chutoanFotoCache')) document.getElementById('bookingList').innerHTML = '<div class="loader" style="color:var(--alert-red)">Lỗi mạng. Vui lòng kiểm tra lại!</div>'; 
            }
        }

        function silentFetchData() {
            fetch(API_URL).then(res => res.json()).then(data => { localStorage.setItem('chutoanFotoCache', JSON.stringify(data)); }).catch(e => console.log(e));
        }

        function renderUI(data) {
            const list = document.getElementById('bookingList');
            if (data.length === 0) { list.innerHTML = '<div class="loader">Chưa có lịch chụp nào.</div>'; return; }

            let validData = data.filter(r => r['Khách hàng'] || findVal(r, 'khách'));

            let groupedData = {};

                else if (timeStr.startsWith('chiều')) sessionStr = 'Chiều';
                else if (timeStr.startsWith('tối') || timeStr.startsWith('đêm')) sessionStr = 'Tối';

                if (!groupedData[yearStr]) groupedData[yearStr] = {};
                if (!groupedData[yearStr][monthStr]) groupedData[yearStr][monthStr] = {};
                if (!groupedData[yearStr][monthStr][displayDate]) groupedData[yearStr][monthStr][displayDate] = {};
                if (!groupedData[yearStr][monthStr][displayDate][sessionStr]) groupedData[yearStr][monthStr][displayDate][sessionStr] = [];
                
                groupedData[yearStr][monthStr][displayDate][sessionStr].push(row);

            let sortedYears = Object.keys(groupedData).sort((a, b) => b.localeCompare(a));

                             ontouchstart="startLongPress(event, 'mb-${yIndex}-${mIndex}', '${monthStr}')"
                             ontouchend="cancelLongPress()"
                             ontouchmove="cancelLongPress()"
                             onmousedown="startLongPress(event, 'mb-${yIndex}-${mIndex}', '${monthStr}')"
                             onmouseup="cancelLongPress()"
                             onmouseleave="cancelLongPress()">

                        </div>

                    let dIndex = 0;
                    
                    for (let dateStr in groupedData[yearStr][monthStr]) {
                        let dayNum = dateStr.includes('/') ? parseInt(dateStr.split('/')[0]) : 0;
                        htmlStr += `<div class="day-block" id="db-${yIndex}-${mIndex}-${dIndex}" data-year="${yearNum}" data-month="${monthNum}" data-day="${dayNum}">

                             ontouchstart="startLongPress(event, 'db-${yIndex}-${mIndex}-${dIndex}', 'Ngày ${dateStr}')"
                             ontouchend="cancelLongPress()"
                             ontouchmove="cancelLongPress()"
                             onmousedown="startLongPress(event, 'db-${yIndex}-${mIndex}-${dIndex}', 'Ngày ${dateStr}')"
                             onmouseup="cancelLongPress()"
                             onmouseleave="cancelLongPress()">

                        </div><div class="day-content" id="day-content-${yIndex}-${mIndex}-${dIndex}">`;
                        
                        let sessionsInDay = Object.keys(groupedData[yearStr][monthStr][dateStr]).sort((a, b) => sessionOrder[a] - sessionOrder[b]);
                        
                        let sIndex = 0;

                                <span>${sessionIcons[session]} ${sessionDisplayText} <i class="toggle-icon" style="display:inline-block; margin-left:6px; transform:rotate(180deg); font-style:normal;">▼</i></span>
                            </div>
                            <div class="session-content" id="sc-${yIndex}-${mIndex}-${dIndex}-${sIndex}">`;

                            groupedData[yearStr][monthStr][dateStr][session].forEach(row => {

                                let conLai = parseNum(findVal(row, 'còn lại')); 
                                let rowIndex = row['_rowIndex'];
                                
                                let mapsVal = findVal(row, 'maps') || row['Link Maps'] || '';
                                let driveVal = findVal(row, 'drive') || row['Link Drive'] || '';
                                let fbVal = findVal(row, 'facebook') || row['Link Facebook'] || '';
                                let zaloVal = findVal(row, 'zalo') || row['SĐT Zalo'] || '';
                                let igVal = findVal(row, 'instagram') || findVal(row, 'ig') || row['Link Instagram'] || '';
                                
                                let sdtVal = findVal(row, 'sđt') || findVal(row, 'điện thoại') || row['SĐT'] || '';
                                let noteVal = findVal(row, 'ghi chú');
                                let rawClientName = row['Khách hàng'] || findVal(row, 'khách') || '';

                                let socialLinks = '';

                                if (zaloVal) {
                                    let zPhone = String(zaloVal).replace(/\D/g, '');
                                    if (zPhone.length === 9 && !zPhone.startsWith('0')) zPhone = '0' + zPhone; 
                                    if (zPhone.startsWith('84') && zPhone.length === 11) zPhone = '0' + zPhone.slice(2);
                                    socialLinks += `<a href="https://zalo.me/${zPhone}" target="_blank" class="social-icon" onclick="event.stopPropagation()">${ZALO_ICON}</a>`;
                                }
                                if (igVal) socialLinks += `<a href="${igVal}" target="_blank" class="social-icon" onclick="event.stopPropagation()">${IG_ICON}</a>`;

                                let clientNameHTML = `<div class="client-name-container">
                                    <span>${rawClientName}</span>
                                    ${socialLinks ? `<div class="social-links-row">${socialLinks}</div>` : ''}
                                </div>`;

                                let sdtHTML = '';
                                if (sdtVal) {
                                    let cleanPhone = sdtVal.toString().replace(/[^\d+]/g, '');
                                    if (cleanPhone.length === 9 && !cleanPhone.startsWith('0')) cleanPhone = '0' + cleanPhone;
                                    if (cleanPhone.startsWith('84') && cleanPhone.length === 11) cleanPhone = '0' + cleanPhone.slice(2);
                                    
                                    sdtHTML = `<div class="location-row" style="margin-bottom: 12px;">
                                        <span class="location-label">${ICON_PHONE} SĐT:</span>
                                        <span class="location-value"><a href="tel:${cleanPhone}" style="color: var(--accent-gold); font-weight: 800; text-decoration: none;" onclick="event.stopPropagation()">${cleanPhone}</a></span>
                                    </div>`;
                                }

                                let moneyStatusHTML = conLai > 0 ? `<span class="debt">Còn nợ: ${formatMoney(conLai)}</span>` : `<span class="paid">Đã tất toán ✓</span>`;

                                let mapsBtn = mapsVal ? `<a href="${mapsVal}" target="_blank" class="action-link-btn maps" onclick="event.stopPropagation()">${ICON_PIN} Maps</a>` : '';
                                let driveBtn = driveVal ? `<a href="${driveVal}" target="_blank" class="action-link-btn drive" onclick="event.stopPropagation()">📁 Drive</a>` : '';
                                let linkButtonsHTML = (mapsBtn || driveBtn) ? `<div class="action-links">${mapsBtn}${driveBtn}</div>` : '';

                                let paidBtnHTML = '';
                                if (conLai > 0) { 
                                    paidBtnHTML = `<div style="margin-top: 12px;"><button type="button" class="btn-pay" onclick="event.stopPropagation(); markPaid('${rowIndex}')">${ICON_CHECK} ĐÃ THANH TOÁN</button></div>`; 
                                }

                                let noteHTML = '';
                                if (noteVal) { noteHTML = `<div class="detail-note" onclick="event.stopPropagation()"><div class="detail-note-label" style="color: var(--text-muted);">${ICON_NOTE} GHI CHÚ / TIMELINE</div><div class="detail-note-content">${noteVal}</div></div>`; }

                                htmlStr += `
                                    <div class="card glass-fx" onclick="toggleSection('expanded-${rowIndex}', this, true)">
                                        <div class="card-header">
                                            <div><h2 class="client-name">${clientNameHTML}</h2><span class="tag-package">${findVal(row, 'nội dung') || 'Gói Chụp'}</span></div>
                                            <span class="tag-session">${findVal(row, 'thời gian') || 'Cả ngày'}</span>
                                        </div>
                                        <div class="location-row"><span class="location-label" style="color: var(--text-muted);">${ICON_PIN} Địa điểm:</span><span class="location-value">${findVal(row, 'địa điểm') || '--'}</span></div>
                                        ${sdtHTML}
                                        ${linkButtonsHTML}
                                        <div class="money-bar"><span class="total">Tổng: <span class="total-num">${formatMoney(gia + phi)}</span></span>${moneyStatusHTML}</div>
                                        <div class="card-expanded-content" id="expanded-${rowIndex}">
                                            <div class="detail-item"><span>Phí đi lại</span><span>${formatMoney(phi)}</span></div>
                                            <div class="detail-item"><span>Tiền cọc</span><span>${formatMoney(coc)}</span></div>
                                            ${noteHTML}
                                            ${paidBtnHTML}
                                            <div class="card-btns-row">
                                                <button type="button" class="btn-card-action btn-edit" onclick="event.stopPropagation(); openEditModal('${rowIndex}')">${ICON_EDIT} SỬA LỊCH</button>
                                                <button type="button" class="btn-card-action btn-delete" onclick="event.stopPropagation(); deleteBooking('${rowIndex}')">${ICON_DELETE} XÓA LỊCH</button>
                                            </div>
                                        </div>
                                    </div>`;
                            });
                            
                            htmlStr += `</div>`; 
                            sIndex++;
                        });
                        htmlStr += `</div></div>`; dIndex++;
                    }
                    htmlStr += `</div></div>`; mIndex++;
                }
                htmlStr += `</div></div>`; yIndex++;
            });
            list.innerHTML = htmlStr; updateStatsUI();
            restoreUIState();
        }

        function toggleSection(id, headerEl, isCard = false) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.toggle('show');
                if (!isCard) { const icon = headerEl.querySelector('.toggle-icon'); icon.style.transform = el.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)'; }
                setTimeout(saveUIState, 100);
            }
        }

        function toggleSession(id, headerEl) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.toggle('collapsed');
                const icon = headerEl.querySelector('.toggle-icon'); 
                if (icon) {
                    icon.style.transform = el.classList.contains('collapsed') ? 'rotate(0deg)' : 'rotate(180deg)';
                }
                setTimeout(saveUIState, 100);
            }
        }

        function updateStatsUI() {
            let fYear = document.getElementById('filterYear').value; 
            let fMonth = document.getElementById('filterMonth').value; 
            let tRev = 0, tPaid = 0, tDebt = 0;
            
            let nameMap = {}; 
            
            allValidData.forEach(row => {
                let dObj = row._dateObj; let matchY = true, matchM = true;
                if (fYear !== "ALL") { if (!dObj || dObj.getFullYear().toString() !== fYear) matchY = false; }
                if (fMonth !== "ALL") { if (!dObj || dObj.getMonth().toString() !== fMonth) matchM = false; }
                
                if (matchY && matchM) {
                    let gia = parseNum(findVal(row, 'giá')); let phi = parseNum(findVal(row, 'phí')); let coc = parseNum(findVal(row, 'cọc')); 
                    let tt = parseNum(findVal(row, 'thanh toán thêm')) || 0; let conLai = parseNum(findVal(row, 'còn lại'));
                    
                    tRev += (gia + phi); tPaid += (coc + tt); tDebt += conLai; 
                    
                    let rawName = row['Khách hàng'] || findVal(row, 'khách') || "";
                    let clientName = rawName.toString().trim().toLowerCase().replace(/\s+/g, ' ');
                    
                    let rawPhone = findVal(row, 'sđt') || findVal(row, 'điện thoại') || row['SĐT'] || "";
                    let phoneNum = rawPhone.toString().replace(/\D/g, '');
                    
                    let rawZalo = findVal(row, 'zalo') || row['SĐT Zalo'] || "";
                    let zaloNum = rawZalo.toString().replace(/\D/g, '');
                    
                    let rawFb = findVal(row, 'facebook') || findVal(row, 'fb') || row['Link Facebook'] || "";
                    let fbLink = rawFb.toString().trim().toLowerCase().replace(/(\?|&)(mibextid|fbclid|locale|eav|paipv)=[^&]*/g, '').replace(/[?&]$/, '').replace(/^https?:\/\/(www\.|m\.)?(facebook\.com|fb\.com|instagram\.com)\//, '').replace(/\/$/, '');
                    
                    let contactKey = phoneNum || zaloNum || fbLink || "no-contact";

                    if (clientName !== "") {
                        if (!nameMap[clientName]) {
                            nameMap[clientName] = new Set();
                        }
                        nameMap[clientName].add(contactKey);
                    }
                }
            });
            
            let totalJobs = 0;
            for (let name in nameMap) {
                let contactSet = nameMap[name];
                let validContacts = Array.from(contactSet).filter(c => c !== "no-contact");
                
                if (validContacts.length > 0) {
                    totalJobs += validContacts.length;
                } else {
                    totalJobs += 1;
                }
            }
            
            document.getElementById('totalRevenue').innerText = formatMoney(tRev); 
            document.getElementById('totalCollected').innerText = formatMoney(tPaid); 
            document.getElementById('totalDebt').innerText = formatMoney(tDebt); 
            document.getElementById('totalShows').innerText = totalJobs;
        }
        
        loadData();

        function closeModal() { document.body.classList.remove('modal-open'); document.getElementById('modalForm').style.display = 'none'; }

            if (!item) {

            let dObj = item._dateObj; document.getElementById('e_ngay').value = dObj ? dateToISO(dObj) : '';
            document.getElementById('e_thoigian').value = findVal(item, 'thời gian'); document.getElementById('e_khach').value = name;
            
            document.getElementById('e_linkfb').value = findVal(item, 'facebook') || item['Link Facebook'] || ''; 
            
            let zaloEdit = findVal(item, 'zalo') || item['SĐT Zalo'] || '';

            } else { document.getElementById('e_zalo').value = ''; }

            document.getElementById('e_diadiem').value = findVal(item, 'địa điểm'); document.getElementById('e_noidung').value = findVal(item, 'nội dung') || 'Khác';
            document.getElementById('e_gia').value = formatInputMoney(findVal(item, 'giá')); document.getElementById('e_phi').value = formatInputMoney(findVal(item, 'phí')); document.getElementById('e_coc').value = formatInputMoney(findVal(item, 'cọc')); 
            
            let sdtEdit = findVal(item, 'sđt') || findVal(item, 'điện thoại') || item['SĐT'] || '';
            if(sdtEdit) {
                let p = String(sdtEdit).replace(/\D/g, '');

                document.getElementById('e_sdt').value = p;
            } else { document.getElementById('e_sdt').value = ''; }

            document.getElementById('e_linkmaps').value = findVal(item, 'maps') || item['Link Maps'] || ''; document.getElementById('e_linkdrive').value = findVal(item, 'drive') || item['Link Drive'] || ''; document.getElementById('e_ghichu').value = findVal(item, 'ghi chú');

        document.querySelectorAll('.money-input').forEach(input => { input.addEventListener('input', function(e) { let value = e.target.value.replace(/\D/g, ''); e.target.value = value !== '' ? new Intl.NumberFormat('vi-VN').format(value) : ''; }); });

        async function markPaid(rowIndex) {
            let item = allValidData.find(r => String(r._rowIndex) === String(rowIndex));
            if (!item) return;
            let name = item['Khách hàng'] || findVal(item, 'khách') || 'Khách hàng';
            
            if (!confirm(`Xác nhận khách hàng "${name}" đã thanh toán toàn bộ số tiền còn lại?`)) return;
            
            let conLaiKey = Object.keys(item).find(k => k.toLowerCase().includes('còn lại')) || 'Còn lại'; 
            item[conLaiKey] = 0; 
            renderUI(allValidData); 
            fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "MARK_PAID", rowIndex: rowIndex }) }).then(() => silentFetchData());
        }

            let item = allValidData.find(r => String(r._rowIndex) === String(payload.rowIndex));
            if (item) {
                let keys = Object.keys(item); item[keys.find(k=>k.toLowerCase().includes('ngày')) || 'Ngày chụp'] = payload.ngayChup; item[keys.find(k=>k.toLowerCase().includes('thời gian')) || 'Thời gian'] = payload.thoiGian; item[keys.find(k=>k.toLowerCase().includes('khách')) || 'Khách hàng'] = payload.khachHang; item['Link Facebook'] = payload.linkFacebook; item['SĐT Zalo'] = payload.zalo; item['Link Instagram'] = payload.instagram; item[keys.find(k=>k.toLowerCase().includes('địa điểm')) || 'Địa điểm'] = payload.diaDiem; item['Link Maps'] = payload.linkMaps; item['Link Drive'] = payload.linkDrive; item[keys.find(k=>k.toLowerCase().includes('nội dung')) || 'Nội dung'] = payload.noiDung; item[keys.find(k=>k.toLowerCase().includes('giá')) || 'Giá gói'] = payload.giaGoi; item[keys.find(k=>k.toLowerCase().includes('phí')) || 'Phí đi lại'] = payload.phiDiLai; item[keys.find(k=>k.toLowerCase().includes('cọc')) || 'Cọc'] = payload.coc; let tt = parseNum(findVal(item, 'thanh toán thêm')) || 0; item[keys.find(k=>k.toLowerCase().includes('còn lại')) || 'Còn lại'] = (payload.giaGoi + payload.phiDiLai) - (payload.coc + tt); item[keys.find(k=>k.toLowerCase().includes('ghi chú')) || 'Ghi chú'] = payload.ghiChu; item[keys.find(k=>k.toLowerCase().includes('sđt')) || 'SĐT'] = payload.sdt; item._dateObj = parseDateCustom(payload.ngayChup);
            }
            renderUI(allValidData); closeModal(); btn.innerText = "LƯU CẬP NHẬT"; btn.style.opacity = 1; btn.disabled = false;
            fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).then(() => silentFetchData());
        }

        async function deleteBooking(rowIndex) {
            let item = allValidData.find(r => String(r._rowIndex) === String(rowIndex));
            if (!item) return;
            let name = item['Khách hàng'] || findVal(item, 'khách') || 'Khách hàng';
            
            if (!confirm(`Bạn có chắc chắn muốn XÓA lịch của khách "${name}" không? Thao tác này không thể hoàn tác.`)) return;
            
            allValidData = allValidData.filter(r => String(r._rowIndex) !== String(rowIndex)); 
            renderUI(allValidData);
            fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "DELETE_ROW", rowIndex: rowIndex }) }).then(() => silentFetchData());
        }
    </script>
